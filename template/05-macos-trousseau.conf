# Exemple à adapter puis intégrer dans ~/.ssh/config.
# Les clés privées restent sur le poste client.

# IgnoreUnknown doit précéder UseKeychain pour les clients non Apple.
IgnoreUnknown UseKeychain

Host rebond
    HostName rebond.example.invalid
    User utilisateur_rebond
    IdentityFile ~/.ssh/cle_rebond
    IdentitiesOnly yes
    AddKeysToAgent yes
    UseKeychain yes

Host vm-isolee
    HostName 10.0.0.10
    User utilisateur_vm
    IdentityFile ~/.ssh/cle_vm
    IdentitiesOnly yes
    ProxyJump rebond
    AddKeysToAgent yes
    UseKeychain yes
