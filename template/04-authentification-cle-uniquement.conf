# Exemple à adapter puis intégrer dans ~/.ssh/config.
# Les clés privées restent sur le poste client.

# Installer et tester les clés avant cette restriction client.

Host rebond
    HostName rebond.example.invalid
    User utilisateur_rebond
    IdentityFile ~/.ssh/cle_rebond
    IdentitiesOnly yes
    PreferredAuthentications publickey

Host vm-isolee
    HostName 10.0.0.10
    User utilisateur_vm
    IdentityFile ~/.ssh/cle_vm
    IdentitiesOnly yes
    ProxyJump rebond
    PreferredAuthentications publickey
