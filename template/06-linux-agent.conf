# Exemple à adapter puis intégrer dans ~/.ssh/config.
# Les clés privées restent sur le poste client.

# Nécessite un agent existant ; ne mémorise pas la passphrase au redémarrage.
# Le déverrouillage persistant dépend du trousseau de la session.

Host rebond
    HostName rebond.example.invalid
    User utilisateur_rebond
    IdentityFile ~/.ssh/cle_rebond
    IdentitiesOnly yes
    AddKeysToAgent yes

Host vm-isolee
    HostName 10.0.0.10
    User utilisateur_vm
    IdentityFile ~/.ssh/cle_vm
    IdentitiesOnly yes
    ProxyJump rebond
    AddKeysToAgent yes
